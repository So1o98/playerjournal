<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progression XP Visualizer</title>
    <!-- Load Chart.js for rendering the interactive graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #eaeaea;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #a5d6a7;
        }
        .controls {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            width: 45%;
        }
        .slider-container {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }
        label {
            font-size: 0.9em;
            margin-bottom: 5px;
            color: #bdbdbd;
            font-weight: bold;
        }
        input[type=number] {
            padding: 8px;
            background-color: #121212;
            border: 1px solid #4caf50;
            color: #ffffff;
            border-radius: 4px;
            font-size: 1.1em;
            width: 100%;
            box-sizing: border-box;
        }
        input[type=number]:focus {
            outline: none;
            border-color: #81c784;
            box-shadow: 0 0 5px rgba(129, 199, 132, 0.5);
        }
        
        /* Custom Styling for the Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            border: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #81c784;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            background: #a5d6a7;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #121212;
            border-radius: 4px;
            border: 1px solid #4caf50;
        }

        .result-box {
            width: 100%;
            background-color: #121212;
            padding: 15px;
            border-left: 5px solid #4caf50;
            border-radius: 4px;
            font-size: 1.1em;
            text-align: center;
            line-height: 1.6;
        }
        .highlight {
            color: #4caf50;
            font-weight: bold;
        }
        .highlight-total {
            color: #64b5f6;
            font-weight: bold;
        }
        canvas {
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <h2>XP Requirement Visualizer</h2>

    <div class="controls">
        <div class="input-group">
            <label for="baseXp">Base XP Requirement (Level 1)</label>
            <input type="number" id="baseXp" value="100" step="10" oninput="updateGraph()">
        </div>
        
        <div class="input-group">
            <label for="multiplier">XP Multiplier</label>
            <input type="number" id="multiplier" value="1.15" step="0.01" oninput="updateGraph()">
        </div>

        <div class="input-group">
            <label for="maxLevel">Graph Max Level Limit</label>
            <input type="number" id="maxLevel" value="50" step="1" min="2" max="500" oninput="updateGraph()">
        </div>

        <!-- Replaced standard input with synced Slider + Number Box -->
        <div class="input-group">
            <label for="targetLevel">Check Specific Level (Drag or Type)</label>
            <div class="slider-container">
                <input type="number" id="targetLevel" value="25" step="1" min="1" style="width: 80px;" oninput="syncFromInput()">
                <input type="range" id="targetSlider" value="25" min="1" max="50" oninput="syncFromSlider()">
            </div>
        </div>

        <div class="result-box">
            To level up from <span class="highlight">Level <span id="displayLevel">25</span></span> to <span class="highlight">Level <span id="displayNextLevel">26</span></span>, the player requires <span class="highlight" id="displayXp">0</span> XP.<br>
            To reach this point from the very beginning, they will have farmed a cumulative total of <span class="highlight-total" id="displayTotalXp">0</span> XP.
        </div>
    </div>

    <!-- The Canvas where the graph renders -->
    <canvas id="xpChart" width="800" height="400"></canvas>

    <script>
        let xpChart;

        // Matches the Java logic perfectly
        function calculateXP(baseReq, multiplier, currentLevel) {
            return Math.floor(baseReq * Math.pow(multiplier, currentLevel - 1));
        }

        // Syncs the slider handle when you type a number
        function syncFromInput() {
            const inputVal = document.getElementById('targetLevel').value;
            document.getElementById('targetSlider').value = inputVal;
            updateGraph();
        }

        // Syncs the number box when you drag the slider
        function syncFromSlider() {
            const sliderVal = document.getElementById('targetSlider').value;
            document.getElementById('targetLevel').value = sliderVal;
            updateGraph();
        }

        function updateGraph() {
            // Fetch inputs
            const baseReq = parseFloat(document.getElementById('baseXp').value) || 0;
            const multiplier = parseFloat(document.getElementById('multiplier').value) || 1;
            const maxLevel = parseInt(document.getElementById('maxLevel').value) || 10;
            const targetLevel = parseInt(document.getElementById('targetLevel').value) || 1;

            // Dynamically update the slider's max limit to match the graph limit
            document.getElementById('targetSlider').max = maxLevel;

            // Generate arrays for the graph X and Y axes
            const levelLabels = [];
            const perLevelData = [];
            const cumulativeData = [];
            
            let runningTotal = 0;
            let exactLevelXp = 0;
            let exactTotalXp = 0;

            for (let i = 1; i <= maxLevel; i++) {
                const levelReq = calculateXP(baseReq, multiplier, i);
                
                levelLabels.push('Lvl ' + i);
                perLevelData.push(levelReq);
                cumulativeData.push(runningTotal); // Total XP earned *before* starting this level
                
                // Capture the exact numbers for the specific level requested by the user
                if (i === targetLevel) {
                    exactLevelXp = levelReq;
                    exactTotalXp = runningTotal;
                }
                
                runningTotal += levelReq;
            }

            // Update specific level text readout
            document.getElementById('displayLevel').innerText = targetLevel;
            document.getElementById('displayNextLevel').innerText = targetLevel + 1;
            document.getElementById('displayXp').innerText = exactLevelXp.toLocaleString(); 
            document.getElementById('displayTotalXp').innerText = exactTotalXp.toLocaleString(); 

            // Update existing chart or create a new one
            if (xpChart) {
                xpChart.data.labels = levelLabels;
                xpChart.data.datasets[0].data = perLevelData;
                xpChart.data.datasets[1].data = cumulativeData;
                xpChart.update();
            } else {
                const ctx = document.getElementById('xpChart').getContext('2d');
                xpChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: levelLabels,
                        datasets: [
                            {
                                label: 'XP Required for Next Level',
                                data: perLevelData,
                                borderColor: '#4caf50',
                                backgroundColor: 'rgba(76, 175, 80, 0.1)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.3,
                                pointBackgroundColor: '#81c784',
                                pointRadius: 2,
                                pointHoverRadius: 6,
                                yAxisID: 'y'
                            },
                            {
                                label: 'Cumulative Total XP Earned',
                                data: cumulativeData,
                                borderColor: '#64b5f6',
                                backgroundColor: 'transparent',
                                borderWidth: 3,
                                borderDash: [5, 5],
                                fill: false,
                                tension: 0.3,
                                pointBackgroundColor: '#90caf9',
                                pointRadius: 0,
                                pointHoverRadius: 6,
                                yAxisID: 'y'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        interaction: {
                            intersect: false,
                            mode: 'index',
                        },
                        scales: {
                            y: {
                                type: 'logarithmic', // Logarithmic scale handles exponential growth much better visually!
                                beginAtZero: true,
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { 
                                    color: '#bdbdbd',
                                    callback: function(value) {
                                        return value.toLocaleString(); // Add commas to axis numbers
                                    }
                                }
                            },
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { 
                                    color: '#bdbdbd',
                                    maxTicksLimit: 20
                                }
                            }
                        },
                        plugins: {
                            legend: { labels: { color: '#eaeaea', font: { size: 14 } } },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                titleFont: { size: 14 },
                                bodyFont: { size: 14 },
                                callbacks: {
                                    label: function(context) {
                                        return context.dataset.label + ': ' + context.raw.toLocaleString() + ' XP';
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        // Initialize the graph on first load
        window.onload = updateGraph;
    </script>
</body>
</html>
